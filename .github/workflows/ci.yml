name: RidePulse v2 CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Node.js Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: ridepulse_backend/package-lock.json
      - name: Install Backend Dependencies
        run: |
          cd ridepulse_backend
          npm ci || npm install
      - name: Build TypeScript
        run: |
          cd ridepulse_backend
          npm run build --if-present

  flutter-test:
    name: Flutter Mobile Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Flutter Dependencies
        run: |
          if [ -d "ridepulse_mobile" ]; then
            cd ridepulse_mobile
            flutter pub get
          fi
