name: RidePulse v2 CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-ci:
    name: Backend CI (TypeCheck, Test & Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: ridepulse_backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd ridepulse_backend
          npm ci || npm install

      - name: Type Check (TSC)
        run: |
          cd ridepulse_backend
          npx tsc --noEmit

      - name: Run Jest Unit & Integration Tests
        run: |
          cd ridepulse_backend
          npm test

      - name: Build TypeScript Output
        run: |
          cd ridepulse_backend
          npm run build
